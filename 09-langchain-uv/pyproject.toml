# 010_FastAPI_Basic.py 실행에 필요한 패키지만 정의
# - 코드에서 직접 import하는 외부 라이브러리만 포함

[project]
name = "langchain-uv"
version = "0.1.0"
description = "LangChain + Groq(OpenAI 호환) + FastAPI 스트리밍 예제"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.128.0",         # 웹 API 서버, StreamingResponse, FileResponse
    "uvicorn>=0.40.0",          # FastAPI 실행 서버
    "pydantic>=2.0",            # 요청/응답 스키마 (QuestionInput, AnswerOutput)
    "langchain-core>=1.2",      # PromptTemplate, 체인 연결 (prompt | llm)
    "langchain-openai>=1.1.7",  # ChatOpenAI (base_url을 Groq로 지정해 사용)
    "python-dotenv>=1.2.1",     # 로컬 실행 시 .env 파일 로드
]

[tool.uv]
# 배포용 라이브러리가 아닌 실행용 앱 (의존성만 설치)
package = false