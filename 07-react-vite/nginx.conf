# React(SPA)용 Nginx 설정
server {
    # 컨테이너 내부에서 80 포트로 요청을 받음
    listen 80;

    # 빌드 결과물(dist)이 복사될 경로
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 요청한 파일이 없으면 index.html을 반환
        # - React Router 등으로 /about 같은 경로를 새로고침해도 404가 나지 않음
        try_files $uri $uri/ /index.html;
    }
}