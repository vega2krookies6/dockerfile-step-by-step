# React 클라이언트 빌드 + Docker Hub push (08-3 의 maven.yml 과 같은 구조)
name: React CI with Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: boot-flyway-web   # Docker Hub 저장소 이름 (소문자)
  DOCKER_TAG: v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 저장소 코드 내려받기
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 설치 + npm 캐시
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 빌드 확인 (오류가 있으면 여기서 실패)
      - name: Build
        run: |
          npm ci
          npm run build

      # ---- 아래는 main 에 push 될 때만 실행 ----

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
