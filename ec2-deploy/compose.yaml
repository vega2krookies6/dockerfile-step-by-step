# ==========================================================
# EC2 배포용 Docker Compose: React(web) + Spring Boot(app) + MariaDB
# - 08-3 compose.yaml 과 다른 점: 소스로 빌드하지 않고 Docker Hub 이미지를 받아서 실행
#   (build: 없음 → EC2 에는 소스 코드, JDK, Node 가 필요 없음)
# - 실행: docker compose pull && docker compose up -d
# - 외부에 열리는 포트는 web 의 80 하나뿐
#
#   인터넷 ──80──▶ web(nginx) ──/api──▶ app:8080 ──▶ mariadb:3306
# ==========================================================

name: boot-flyway

services:

  # --------------------------------------------------------
  # MariaDB (공식 이미지, 설정은 .env + db/init 으로 주입)
  # --------------------------------------------------------
  mariadb:
    image: mariadb:10.11.18
    env_file: .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # EC2 자신(127.0.0.1)에서만 접속 가능 → 인터넷에서는 접근 불가
    # 내 PC 의 DBeaver 로 보려면 SSH 터널 사용 (README 참고)
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------
  # Spring Boot 앱 (Docker Hub: hub_username/boot-flyway-app)
  # --------------------------------------------------------
  app:
    image: ${DOCKERHUB_USERNAME}/boot-flyway-app:${APP_TAG:-latest}
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      # 작은 인스턴스용: JVM 이 컨테이너 메모리 한도의 일부만 쓰도록
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    # ports 없음: 외부에서 직접 접근하지 않고 web(nginx)을 거쳐서만 호출됨
    # 메모리 한도 (t3.small 2GB 기준, 인스턴스가 크면 늘려도 됨)
    mem_limit: 768m
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------
  # React 클라이언트 (Docker Hub: 아이디/boot-flyway-web)
  # --------------------------------------------------------
  web:
    image: ${DOCKERHUB_USERNAME}/boot-flyway-web:${WEB_TAG:-latest}
    environment:
      BACKEND_URL: http://app:8080
    ports:
      - "80:80"
    # 앱이 healthy(Flyway 마이그레이션 완료)가 된 뒤 시작 → 처음 접속 시 502 방지
    # (app 이미지 Dockerfile 의 HEALTHCHECK 사용)
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb-data:
