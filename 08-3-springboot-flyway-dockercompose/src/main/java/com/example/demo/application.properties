# 앱 이름 (로그에 표시됨)
spring.application.name=boot-flyway

# 컨테이너 내부에서 사용할 포트
server.port=8080

# ==========================================================
# DB 접속 정보 (08-2와 같음)
# - ${이름:기본값}: 환경 변수가 있으면 그 값을, 없으면 기본값 사용
# - Docker Compose가 compose.yaml의 environment로 값을 넣어 줌
# - 비밀번호는 기본값을 두지 않음 (코드와 이미지에 비밀 값을 남기지 않기 위해)
# ==========================================================
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${MARIADB_DATABASE:boot_db}
spring.datasource.username=${MARIADB_USER:boot}
spring.datasource.password=${MARIADB_PASSWORD}

# ==========================================================
# Flyway 설정
# - 앱이 시작될 때 JPA보다 먼저 실행되어 db/migration의 SQL을 버전 순서대로 적용
# - 이미 적용된 버전은 flyway_schema_history 테이블에 기록되어 다시 실행하지 않음
# - locations: SQL 파일 위치 (src/main/resources/db/migration, 기본값과 같지만 명시)
# - clean-disabled=true: 모든 테이블을 지우는 flyway clean 명령을 막음 (기본값과 같지만 명시)
#   boot 계정은 DROP 권한이 없어서 어차피 실행되지 않음
# ==========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# ==========================================================
# JPA 설정
# - [08-2와 다른 점] ddl-auto: update → validate
#   validate: 테이블을 만들거나 바꾸지 않고, Entity와 실제 테이블 구조가 맞는지 "검사만" 함
#   맞지 않으면 앱이 시작되지 않음 → 테이블 구조는 오직 Flyway SQL로만 변경
# - open-in-view=false: 요청이 끝날 때까지 DB 연결을 붙잡고 있지 않도록 (권장 설정)
# - show-sql=true: 실행되는 SQL을 로그에 출력 (학습용)
# ==========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ==========================================================
# Actuator 설정
# - health만 외부에 공개, DB 연결 상태(db)까지 보이도록 (학습용)
# ==========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
