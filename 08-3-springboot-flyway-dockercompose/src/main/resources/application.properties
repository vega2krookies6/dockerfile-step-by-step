# 앱 이름 (로그에 표시됨)
spring.application.name=boot-mariadb

# 컨테이너 내부에서 사용할 포트
server.port=8080

# ==========================================================
# DB 접속 정보
# - ${이름:기본값} 형식: 환경 변수가 있으면 그 값을, 없으면 기본값 사용
# - 비밀번호는 기본값을 두지 않음 (코드와 이미지에 비밀 값을 남기지 않기 위해)
# - DB_HOST는 실행 위치에 따라 다름
#     로컬에서 앱 실행(mvn spring-boot:run) : localhost   (기본값)
#     Docker 컨테이너로 앱 실행             : mariadb     (docker run -e DB_HOST=mariadb)
# - DB 이름, 계정, 비밀번호는 MariaDB 컨테이너와 같은 .env 파일의 값을 그대로 사용
# ==========================================================
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${MARIADB_DATABASE:boot_db}
spring.datasource.username=${MARIADB_USER:boot}
spring.datasource.password=${MARIADB_PASSWORD}

# ==========================================================
# JPA 설정
# - update: 테이블이 없으면 만들고, 있으면 필요한 컬럼만 추가 (DROP 하지 않음)
#   boot 계정의 DROP 권한을 회수했으므로 create, create-drop은 쓰면 안 됨
# - open-in-view=false: 요청이 끝날 때까지 DB 연결을 붙잡고 있지 않도록 (권장 설정)
# - show-sql=true: 실행되는 SQL을 로그에 출력 (docker logs로 확인, 학습용)
# ==========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# [배포] Flyway 가 기동 시 db/migration 의 마이그레이션을 적용한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================================
# Actuator 설정
# - health만 외부에 공개
# - show-details=always: /actuator/health에서 DB 연결 상태(db)까지 보이도록 (학습용)
#   운영 환경에서는 내부 정보가 노출되므로 never 또는 when-authorized 권장
# ==========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
